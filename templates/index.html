<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avant-Premières Lyon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen py-10 px-4 font-sans selection:bg-amber-400 selection:text-zinc-950">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-amber-400 tracking-tight">Avant-Premières Lyon</h1>
            <p class="text-zinc-400 mt-2 text-sm sm:text-base">Le Comœdia & les cinémas UGC de la Métropole</p>
        </header>

        <!-- Barre de recherche et filtres -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 mb-8 shadow-xl space-y-4">
            
            <!-- 1. Barre de recherche textuelle -->
            <div class="relative">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Rechercher un film, un invité, un cinéma..." 
                    class="w-full bg-zinc-800 border border-zinc-700 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 placeholder-zinc-500 transition"
                >
            </div>

            <!-- 2. Filtres rapides par Période (Chips) -->
            <div>
                <span class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2.5">Date :</span>
                <div class="flex flex-wrap gap-2" id="date-pills">
                    <button data-filter="all" class="pill-btn active px-3.5 py-1.5 rounded-full text-xs font-medium border border-amber-400 bg-amber-400 text-zinc-950 transition">
                        Toutes les dates
                    </button>
                    <button data-filter="today" class="pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-zinc-500 transition">
                        Aujourd'hui
                    </button>
                    <button data-filter="tomorrow" class="pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-zinc-500 transition">
                        Demain
                    </button>
                    <button data-filter="weekend" class="pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-zinc-500 transition">
                        Ce week-end
                    </button>
                    <button data-filter="week" class="pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-zinc-500 transition">
                        7 prochains jours
                    </button>
                </div>
            </div>

            <!-- 3. Filtres complémentaires : Équipe, Cinéma & Date précise -->
            <div class="flex flex-wrap items-center justify-between gap-4 pt-3 border-t border-zinc-800/80">
                <div class="flex flex-wrap items-center gap-3">
                    <!-- Filtre Équipe -->
                    <button id="cast-toggle" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-purple-500/40 bg-purple-950/30 text-purple-300 hover:bg-purple-900/50 transition flex items-center gap-1.5">
                        <span>👥 Avec équipe</span>
                    </button>

                    <!-- Filtre Cinéma -->
                    <div class="flex items-center gap-2">
                        <label for="cinema-filter" class="text-xs font-bold uppercase tracking-wider text-zinc-400">Cinéma :</label>
                        <select id="cinema-filter" class="bg-zinc-800 border border-zinc-700 text-white rounded-lg px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                            <option value="">Tous les cinémas</option>
                            <!--__CINEMA_OPTIONS__-->
                        </select>
                    </div>

                    <!-- Date libre -->
                    <div class="flex items-center gap-2">
                        <label for="custom-date" class="text-xs font-bold uppercase tracking-wider text-zinc-400">Date précise :</label>
                        <input type="date" id="custom-date" class="bg-zinc-800 border border-zinc-700 text-white rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                </div>

                <div id="results-count" class="text-xs text-zinc-400 font-medium"></div>
            </div>
        </section>

        <!-- Liste des films regroupés -->
        <main id="movies-list" class="space-y-5"></main>
        <p id="empty-state" class="text-center text-zinc-500 py-16 hidden">Aucune avant-première trouvée pour ces critères.</p>
    </div>

    <script>
        const rawScreenings = /*__SCREENINGS_DATA__*/;
        const listEl = document.getElementById('movies-list');
        const emptyEl = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const cinemaSelect = document.getElementById('cinema-filter');
        const customDateInput = document.getElementById('custom-date');
        const castToggleBtn = document.getElementById('cast-toggle');
        const pills = document.querySelectorAll('.pill-btn');
        const countEl = document.getElementById('results-count');

        let activeDateMode = 'all';
        let onlyWithCast = false;

        function formatDateFr(isoDate) {
            const [y, m, d] = isoDate.split('-');
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        function getStartOfDay(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function filterByDate(itemDateStr) {
            const [y, m, d] = itemDateStr.split('-');
            const itemDate = getStartOfDay(new Date(y, m - 1, d));
            const now = getStartOfDay(new Date());

            if (activeDateMode === 'all') return true;

            if (activeDateMode === 'today') {
                return itemDate.getTime() === now.getTime();
            }

            if (activeDateMode === 'tomorrow') {
                const tomorrow = new Date(now);
                tomorrow.setDate(now.getDate() + 1);
                return itemDate.getTime() === tomorrow.getTime();
            }

            if (activeDateMode === 'weekend') {
                const dayOfWeek = now.getDay();
                const fri = new Date(now);
                fri.setDate(now.getDate() + ((5 - dayOfWeek + 7) % 7));
                const sun = new Date(fri);
                sun.setDate(fri.getDate() + 2);
                return itemDate >= fri && itemDate <= sun;
            }

            if (activeDateMode === 'week') {
                const next7Days = new Date(now);
                next7Days.setDate(now.getDate() + 7);
                return itemDate >= now && itemDate <= next7Days;
            }

            if (activeDateMode === 'custom' && customDateInput.value) {
                return itemDateStr === customDateInput.value;
            }

            return true;
        }

        function groupScreeningsByMovie(screenings) {
            const moviesMap = new Map();

            screenings.forEach(s => {
                const key = s.title.trim().toLowerCase();
                
                if (!moviesMap.has(key)) {
                    moviesMap.set(key, {
                        title: s.title,
                        poster_url: s.poster_url,
                        description: s.description || "",
                        has_cast: (s.has_cast === 1 || s.has_cast === true),
                        screenings: []
                    });
                }
                const entry = moviesMap.get(key);
                if (!entry.poster_url && s.poster_url) entry.poster_url = s.poster_url;
                
                // Si la séance apporte une description plus complète (ex: Comœdia), on la retient
                if (s.description && (!entry.description || s.description.length > entry.description.length)) {
                    entry.description = s.description;
                }

                if (s.has_cast === 1 || s.has_cast === true) entry.has_cast = true;
                entry.screenings.push(s);
            });

            return Array.from(moviesMap.values());
        }

        function render(groupedMovies, totalScreeningsCount) {
            listEl.innerHTML = '';
            countEl.textContent = `${groupedMovies.length} film${groupedMovies.length > 1 ? 's' : ''} (${totalScreeningsCount} séance${totalScreeningsCount > 1 ? 's' : ''})`;

            if (groupedMovies.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            }
            emptyEl.classList.add('hidden');

            groupedMovies.forEach(movie => {
                const card = document.createElement('article');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 hover:border-zinc-700 transition flex flex-col sm:flex-row gap-4 sm:gap-5 shadow-md relative";

                const posterHtml = movie.poster_url 
                    ? `<img src="${movie.poster_url}" alt="${movie.title}" class="w-20 h-28 sm:w-28 sm:h-40 object-cover rounded-xl shrink-0 border border-zinc-800 shadow self-start">`
                    : `<div class="w-20 h-28 sm:w-28 sm:h-40 bg-zinc-800 rounded-xl shrink-0 flex items-center justify-center text-zinc-500 text-xs text-center p-2 self-start">Sans affiche</div>`;

                const castBadge = movie.has_cast
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold bg-purple-500/20 text-purple-300 border border-purple-500/30">
                        👥 En présence de l'équipe
                       </span>`
                    : '';

                // Règle d'affichage :
                // - Si plusieurs séances : masquée par défaut et lisible au survol
                // - Si séance unique : affichée sous le titre
                let descriptionHtml = '';
                const hasMultipleScreenings = movie.screenings.length > 1;

                if (movie.description) {
                    if (hasMultipleScreenings) {
                        descriptionHtml = `
                            <div class="relative group mt-2 inline-flex items-center">
                                <span class="text-xs text-zinc-500 underline decoration-dotted underline-offset-2 cursor-help hover:text-zinc-300 transition">
                                    ℹ️ En savoir plus sur le film
                                </span>
                                <div class="absolute left-0 bottom-full mb-2 w-72 sm:w-96 p-3 bg-zinc-950/95 border border-zinc-700 rounded-xl text-xs text-zinc-300 shadow-2xl backdrop-blur-sm opacity-0 invisible group-hover:opacity-100 group-hover:visible transition duration-150 z-20 pointer-events-none">
                                    ${movie.description}
                                </div>
                            </div>
                        `;
                    } else {
                        descriptionHtml = `<p class="mt-2 text-xs sm:text-sm text-zinc-400 leading-relaxed">${movie.description}</p>`;
                    }
                }

                const slotsHtml = movie.screenings.map(s => {
                    const isCast = (s.has_cast === 1 || s.has_cast === true);
                    return `
                        <div class="flex items-center justify-between gap-3 bg-zinc-950/60 border border-zinc-800/80 rounded-xl px-3 py-2 hover:border-zinc-700 transition">
                            <div class="flex flex-col min-w-0">
                                <span class="text-xs font-semibold text-zinc-200 truncate">
                                    ${s.cinema}
                                </span>
                                <span class="text-[11px] text-amber-400 font-medium">
                                    ${formatDateFr(s.date)} à ${s.time}
                                    ${isCast ? '<span class="text-purple-300 ml-1 font-semibold">• avec équipe</span>' : ''}
                                </span>
                            </div>
                            ${s.url ? `
                                <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="shrink-0 text-xs font-semibold bg-amber-400 hover:bg-amber-300 text-zinc-950 px-2.5 py-1 rounded-lg transition shadow-sm">
                                    Réserver ↗
                                </a>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    ${posterHtml}
                    <div class="flex-1 min-w-0 flex flex-col justify-between">
                        <div>
                            <div class="flex flex-wrap items-center gap-2">
                                <h2 class="text-lg sm:text-xl font-bold text-white leading-snug lowercase">${movie.title}</h2>
                                ${castBadge}
                            </div>
                            ${descriptionHtml}
                        </div>
                        <div class="mt-4 pt-3 border-t border-zinc-800/80 space-y-2">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-zinc-500">Séances disponibles :</span>
                            <div class="grid grid-cols-1 gap-2">
                                ${slotsHtml}
                            </div>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function applyAllFilters() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedCinema = cinemaSelect.value;

            const filteredScreenings = rawScreenings.filter(s => {
                const matchQuery = !query || 
                    s.title.toLowerCase().includes(query) || 
                    (s.description && s.description.toLowerCase().includes(query)) ||
                    s.cinema.toLowerCase().includes(query);
                
                const matchCinema = selectedCinema ? s.cinema === selectedCinema : true;
                const matchDate = filterByDate(s.date);
                const matchCast = onlyWithCast ? (s.has_cast === 1 || s.has_cast === true) : true;

                return matchQuery && matchCinema && matchDate && matchCast;
            });

            const grouped = groupScreeningsByMovie(filteredScreenings);
            render(grouped, filteredScreenings.length);
        }

        // Événements
        searchInput.addEventListener('input', applyAllFilters);

        castToggleBtn.addEventListener('click', () => {
            onlyWithCast = !onlyWithCast;
            if (onlyWithCast) {
                castToggleBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border border-purple-400 bg-purple-600 text-white transition flex items-center gap-1.5 shadow-sm";
            } else {
                castToggleBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border border-purple-500/40 bg-purple-950/30 text-purple-300 hover:bg-purple-900/50 transition flex items-center gap-1.5";
            }
            applyAllFilters();
        });

        pills.forEach(btn => {
            btn.addEventListener('click', () => {
                pills.forEach(p => {
                    p.className = "pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-zinc-500 transition";
                });
                btn.className = "pill-btn active px-3.5 py-1.5 rounded-full text-xs font-medium border border-amber-400 bg-amber-400 text-zinc-950 transition";
                
                activeDateMode = btn.dataset.filter;
                customDateInput.value = '';
                applyAllFilters();
            });
        });

        customDateInput.addEventListener('change', () => {
            if (customDateInput.value) {
                pills.forEach(p => {
                    p.className = "pill-btn px-3.5 py-1.5 rounded-full text-xs font-medium border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-zinc-500 transition";
                });
                activeDateMode = 'custom';
                applyAllFilters();
            }
        });

        cinemaSelect.addEventListener('change', applyAllFilters);

        applyAllFilters();
    </script>
</body>
</html>
