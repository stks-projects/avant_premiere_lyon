<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avant-Premières Lyon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen py-10 px-4 font-sans">
    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-amber-400 tracking-tight">Avant-Premières Lyon</h1>
            <p class="text-zinc-400 mt-2">Le Comœdia & les cinémas UGC de la Métropole</p>
        </header>

        <!-- Filtres Date & Cinéma -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-8 shadow-lg flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2">
                    <label for="cinema-filter" class="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Cinéma :</label>
                    <select id="cinema-filter" class="bg-zinc-800 border border-zinc-700 text-white rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="">Tous les cinémas</option>
                        <!--__CINEMA_OPTIONS__-->
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label for="date-filter" class="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Date :</label>
                    <input type="date" id="date-filter" class="bg-zinc-800 border border-zinc-700 text-white rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>
            </div>
            <button id="reset-btn" class="text-xs text-zinc-400 hover:text-amber-400 transition hidden underline">
                Réinitialiser les filtres
            </button>
        </div>

        <!-- Liste des séances -->
        <div id="screenings-list" class="space-y-4"></div>
        <p id="empty-state" class="text-center text-zinc-500 py-12 hidden">Aucune avant-première ne correspond à ces critères.</p>
    </div>

    <script>
        const screenings = /*__SCREENINGS_DATA__*/;
        const listEl = document.getElementById('screenings-list');
        const emptyEl = document.getElementById('empty-state');
        const dateInput = document.getElementById('date-filter');
        const cinemaSelect = document.getElementById('cinema-filter');
        const resetBtn = document.getElementById('reset-btn');

        function formatDateFr(isoDate) {
            const [y, m, d] = isoDate.split('-');
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        function render(items) {
            listEl.innerHTML = '';
            if (items.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            }
            emptyEl.classList.add('hidden');

            items.forEach(s => {
                const card = document.createElement('article');
                card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-5 hover:border-zinc-700 transition flex gap-5 items-start";
                
                const posterHtml = s.poster_url 
                    ? `<img src="${s.poster_url}" alt="${s.title}" class="w-24 h-32 object-cover rounded-xl shrink-0 border border-zinc-800 shadow">`
                    : `<div class="w-24 h-32 bg-zinc-800 rounded-xl shrink-0 flex items-center justify-center text-zinc-500 text-xs text-center p-2">Pas d'affiche</div>`;

                const bookingBtn = s.url 
                    ? `<a href="${s.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs font-semibold bg-amber-400 hover:bg-amber-300 text-zinc-950 px-3.5 py-1.5 rounded-lg whitespace-nowrap transition shadow-sm">
                        Réserver ↗
                       </a>`
                    : '';

                card.innerHTML = `
                    ${posterHtml}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-4">
                            <span class="text-xs font-semibold uppercase tracking-wider text-amber-400">
                                ${s.cinema} • ${formatDateFr(s.date)} à ${s.time}
                            </span>
                            ${bookingBtn}
                        </div>
                        <h2 class="text-xl font-bold text-white mt-1.5">${s.title}</h2>
                        ${s.description ? `<p class="mt-2 text-sm text-zinc-300 leading-relaxed">${s.description}</p>` : ''}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function applyFilters() {
            const selectedDate = dateInput.value;
            const selectedCinema = cinemaSelect.value;

            if (selectedDate || selectedCinema) {
                resetBtn.classList.remove('hidden');
            } else {
                resetBtn.classList.add('hidden');
            }

            const filtered = screenings.filter(s => {
                const matchDate = selectedDate ? s.date === selectedDate : true;
                const matchCinema = selectedCinema ? s.cinema === selectedCinema : true;
                return matchDate && matchCinema;
            });

            render(filtered);
        }

        dateInput.addEventListener('change', applyFilters);
        cinemaSelect.addEventListener('change', applyFilters);

        resetBtn.addEventListener('click', () => {
            dateInput.value = '';
            cinemaSelect.value = '';
            resetBtn.classList.add('hidden');
            render(screenings);
        });

        render(screenings);
    </script>
</body>
</html>
