name: Scrape & Déploiement GitHub Pages

on:
  schedule:
    # Tourne chaque jour à 6h00 UTC
    - cron: '0 6 * * 6'
  workflow_dispatch: # Déclencheur manuel
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python & Chromium
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            playwright install --with-deps chromium

      - name: Scraper et générer le site statique
        run: python build.py

      - name: Sauvegarder la base SQLite sur le repo
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add avp_lyon.db
          git diff --staged --quiet || (git commit -m "chore(data): màj des avant-premières" && git push)

      - name: Téléverser l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4