name: Scrape Comœdia AVP

on:
  schedule:
    # S'exécute tous les jours à 6h00 UTC (7h00 ou 8h00 heure de Lyon)
    - cron: '0 6 * * *'
  # Permet de lancer le workflow manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Exécuter le scraper
        run: |
          python scraper.py

      - name: Sauvegarder et commiter la base de données
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add avp_lyon.db
          # Ne commite que si la base a été modifiée
          git diff --staged --quiet || (git commit -m "chore(data): màj des avant-premières" && git push)